name: Chromatic

# Storybook の視覚回帰テストを Chromatic で実行する。
#
# 設計判断:
# - `CHROMATIC_PROJECT_TOKEN` が未設定でも CI を落とさない（`if` ガード + `continue-on-error`）。
#   オーケストレーター側で後から Chromatic アカウントを接続して Secret を登録する想定。
# - `onlyChanged: true` で変更コンポーネントのみテストし実行時間を抑える（無料枠考慮）。
# - `exitZeroOnChanges: true` で UI 差分があっても CI を落とさず warning レベル運用にする。
#   厳格化したくなったら false に切り替える。
# - 並行で `build-storybook` を実行し、Storybook 自体が壊れていないかを CHROMATIC_PROJECT_TOKEN
#   未設定時でも検出できるようにする。

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-storybook:
    name: Storybook ビルド検証
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6
        with:
          # Chromatic の baseline 比較用に履歴を全部取る（onlyChanged の判定に必要）
          fetch-depth: 0

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Storybook をビルド
        run: pnpm --filter @oceans-tenant/web build-storybook

      - name: storybook-static を成果物としてアップロード
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/web/storybook-static
          retention-days: 7

  chromatic:
    name: Chromatic 視覚回帰
    runs-on: ubuntu-latest
    needs: build-storybook
    # CHROMATIC_PROJECT_TOKEN が未設定のうちは job 自体をスキップする。
    # secrets コンテキストは job レベルでしか参照できないため、env に格納して `if` を書く。
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    steps:
      - name: ソース取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: トークン未設定なら以降のステップをスキップ
        id: token-check
        run: |
          if [ -z "${CHROMATIC_PROJECT_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PROJECT_TOKEN が未設定のため Chromatic 実行をスキップします。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pnpm をセットアップ
        if: steps.token-check.outputs.skip == 'false'
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        if: steps.token-check.outputs.skip == 'false'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        if: steps.token-check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Chromatic を実行
        if: steps.token-check.outputs.skip == 'false'
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          buildScriptName: build-storybook
          # 変更のあった stories のみ実行（無料枠 / 実行時間短縮）
          onlyChanged: true
          # UI 差分があっても CI は通す（baseline 確立フェーズなので warning レベル運用）
          exitZeroOnChanges: true
          # storybook を毎回ビルドする（前 job の artifact を引き継ぐより簡潔）
          autoAcceptChanges: main
