name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 17:00 UTC（火曜 02:00 JST）に main をスキャン
    - cron: "0 17 * * 1"

jobs:
  analyze:
    name: 静的解析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: CodeQL を初期化
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: CodeQL 解析を実行
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
