name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright テスト
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      # NOTE: 実 Playwright テストは Phase 2 の Issue で `e2e/` 配下に追加する。
      # 現時点では placeholder ステップのみで green を維持する。
      - name: Playwright テスト（placeholder）
        run: |
          if [ -d "e2e" ]; then
            pnpm exec playwright install --with-deps chromium
            pnpm --filter @oceans-tenant/web exec playwright test
          else
            echo "e2e/ ディレクトリがまだ存在しないためスキップ"
          fi

      - name: テスト結果をアップロード
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
