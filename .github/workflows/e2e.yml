name: E2E (Playwright)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザをキャッシュ
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package.json', 'pnpm-lock.yaml') }}

      - name: Playwright ブラウザをインストール
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @oceans-tenant/web exec playwright install --with-deps chromium webkit

      - name: Playwright ブラウザの依存関係を更新（キャッシュヒット時）
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @oceans-tenant/web exec playwright install-deps chromium webkit

      - name: Next.js を本番ビルド
        run: pnpm --filter @oceans-tenant/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # NEXT_PUBLIC_* は build 時に inline されるため、admin E2E が
          # Header の「管理」リンクを見つけられるように build 段階で flag を有効化する。
          NEXT_PUBLIC_ADMIN_ENABLED: "true"

      - name: Playwright テスト
        run: pnpm --filter @oceans-tenant/web exec playwright test
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_ADMIN_ENABLED: "true"

      - name: テスト結果をアップロード
        if: always() && hashFiles('apps/web/playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
