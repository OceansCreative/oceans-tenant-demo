name: Lighthouse CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse 計測 (/, /search, /chat, /properties/[slug])
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Next.js を本番ビルド
        run: pnpm --filter @oceans-tenant/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Next.js を背景起動
        run: |
          pnpm --filter @oceans-tenant/web exec next start --port 3000 &
          echo $! > /tmp/next-server.pid
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: サーバー起動を待機
        run: |
          # ci.yml と統一した curl ループ。最大 60 秒待つ。
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:3000/ > /dev/null; then
              echo "Next.js サーバー起動を確認"
              exit 0
            fi
            sleep 1
          done
          echo "Next.js サーバーが起動しなかった"
          exit 1

      - name: Lighthouse CI を実行
        working-directory: apps/web
        run: pnpm exec lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Next.js サーバーを停止
        if: always()
        run: |
          if [ -f /tmp/next-server.pid ]; then
            kill "$(cat /tmp/next-server.pid)" || true
          fi

      - name: Lighthouse レポートをアップロード
        if: always() && hashFiles('apps/web/.lighthouseci/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7
