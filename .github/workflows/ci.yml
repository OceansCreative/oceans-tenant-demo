name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

  typecheck:
    name: 型チェック (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

  test:
    name: ユニットテスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: テスト実行（カバレッジ付き）
        run: pnpm test:coverage

      - name: カバレッジ成果物をアップロード（PR から確認可能に）
        if: always() && hashFiles('**/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/
            packages/shared/coverage/
          retention-days: 14

      - name: カバレッジを Codecov にアップロード（web ワークスペース）
        if: hashFiles('apps/web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          # public repo のため tokenless で動作する想定。
          # token を Secrets に登録した場合は自動で使われ、未登録でも `fail_ci_if_error: false` で CI を落とさない。
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./apps/web/coverage/lcov.info
          flags: web
          name: web-coverage
          disable_search: true

      - name: カバレッジを Codecov にアップロード（shared ワークスペース）
        if: hashFiles('packages/shared/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./packages/shared/coverage/lcov.info
          flags: shared
          name: shared-coverage
          disable_search: true

  python:
    name: Python テスト (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/python/requirements.txt

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]"

      - name: pytest（カバレッジ付き）
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: カバレッジを Codecov にアップロード（python）
        if: hashFiles('scripts/python/coverage.xml') != ''
        uses: codecov/codecov-action@v6
        with:
          # public repo のため tokenless で動作する想定。
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./scripts/python/coverage.xml
          flags: python
          name: python-coverage
          disable_search: true
