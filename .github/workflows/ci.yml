name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

  typecheck:
    name: 型チェック (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

  test:
    name: ユニットテスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: テスト実行（カバレッジ付き）
        run: pnpm test:coverage
        # NOTE: 各ワークスペースの実テストは Issue #5 以降で順次追加する。
        # この段階では placeholder テストのみが走るため CI は green になる。

      - name: カバレッジを Codecov にアップロード
        if: hashFiles('**/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./coverage/lcov.info,./apps/web/coverage/lcov.info,./apps/studio/coverage/lcov.info,./packages/shared/coverage/lcov.info

  python:
    name: Python テスト (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/python
    steps:
      - name: ソース取得
        uses: actions/checkout@v6

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/python/requirements.txt

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pydantic[email]"

      - name: pytest（カバレッジ付き）
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: カバレッジを Codecov にアップロード
        if: hashFiles('scripts/python/coverage.xml') != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./scripts/python/coverage.xml
          flags: python
