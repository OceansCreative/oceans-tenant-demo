name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

  typecheck:
    name: 型チェック (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

  test:
    name: ユニットテスト (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: ソース取得
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Node.js をセットアップ
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: テスト実行（カバレッジ付き）
        run: pnpm test:coverage
        # NOTE: 各ワークスペースの実テストは Issue #5 以降で順次追加する。
        # この段階では placeholder テストのみが走るため CI は green になる。

      - name: カバレッジを Codecov にアップロード
        if: hashFiles('**/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: ./coverage/lcov.info,./apps/web/coverage/lcov.info,./apps/studio/coverage/lcov.info,./packages/shared/coverage/lcov.info
