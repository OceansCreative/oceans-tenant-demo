[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oceans-tenant-seed"
version = "0.1.0"
description = "OceansTenant Sanity ダミーデータ生成スクリプト"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["oceans_tenant_seed*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["oceans_tenant_seed"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
