# Codecov 設定（OceansTenant v0.5.0 WS-3 で導入）
#
# 方針:
# - public repo のため tokenless で動作する想定。CODECOV_TOKEN を後付けする場合も
#   既存 CI ワークフロー（`.github/workflows/ci.yml`）は両対応にしてある。
# - `project` ターゲットは `auto`（直前コミット比）。1% の許容で軽微な揺れは PASS。
# - `patch` ターゲットは 70% に固定。新規 / 変更行のテスト率を底上げする方向に
#   段階的に強化していく。
# - 当面は `informational: true` で CI を fail させない warning 運用にする。
#   コードベース成熟後、閾値強制に切替える前提。

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
        only_pulls: false
    patch:
      default:
        target: 70%
        threshold: 1%
        informational: true

# Codecov コメントレイアウト。PR で「到達度 / 差分 / フラグ / ファイル」の順に表示。
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

# 計測対象から除外（vitest 側の exclude と整合）
ignore:
  - "apps/web/src/app/**/page.tsx"
  - "apps/web/src/app/**/layout.tsx"
  - "apps/web/src/app/og/**"
  - "apps/web/src/app/sitemap.ts"
  - "apps/web/src/app/robots.ts"
  - "apps/web/src/lib/site.ts"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/__tests__/**"
  - "**/*.d.ts"
  - "e2e/**"
  - "scripts/**"
  - "docs/**"

# ワークスペース別にフラグ付け（CI で `flags` を指定すると粒度の高い分析が可能）
flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
      - type: patch
        target: 70%
        threshold: 1%
        informational: true
  individual_flags:
    - name: web
      paths:
        - apps/web/
    - name: shared
      paths:
        - packages/shared/
    - name: python
      paths:
        - scripts/python/
